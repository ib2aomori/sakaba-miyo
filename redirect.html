<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文ページへ</title>
  <!-- このサイト内の order.html に飛ばす（Safari/Chrome/インアプリどれでも同じ注文ページが開く） -->
  <meta id="meta-refresh" http-equiv="refresh" content="0;url=order.html">
  <style>
    body { font-family: sans-serif; text-align: center; padding: 2rem; background: #faf6f1; }
    a { color: #1e3a5f; font-weight: bold; font-size: 1.1rem; }
    p { margin: 1rem 0; color: #333; }
  </style>
</head>
<body>
  <p>注文ページへ移動しています...</p>
  <p><a id="openLink" href="order.html">開かない場合はここをタップ</a></p>
  <script>
    (function() {
      var qs = window.location.search ? window.location.search : "";
      var target = "order.html" + qs;
      document.getElementById("openLink").href = target;
      document.getElementById("meta-refresh").content = "0;url=" + target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
